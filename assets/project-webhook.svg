<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-labelledby="t d">
  <title id="t">Webhook Email Service</title>
  <desc id="d">Event pipeline flowing through a secure webhook and email delivery service.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091526"/><stop offset="1" stop-color="#13203a"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#58dcf0"/><stop offset=".5" stop-color="#74f5d1"/><stop offset="1" stop-color="#8da6ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#4f8cbd" stop-opacity=".24"/><stop offset="1" stop-color="#4f8cbd" stop-opacity="0"/></radialGradient>
  </defs>
  <style>@keyframes travel{to{stroke-dashoffset:-44}}.flow{animation:travel 3s linear infinite}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  <rect width="600" height="290" rx="20" fill="url(#bg)"/>
  <circle cx="318" cy="146" r="200" fill="url(#glow)"/>
  <text x="31" y="49" fill="#8baab9" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">EVENT-DRIVEN INTEGRATION</text>
  <path d="M121 145H480" stroke="#214453" stroke-width="11" stroke-linecap="round"/>
  <path d="M121 145H480" stroke="url(#line)" stroke-opacity=".8" stroke-width="3" stroke-dasharray="14 9" class="flow"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(34 104)">
      <rect width="126" height="82" rx="15" fill="#0b2634" stroke="#50c9dc" stroke-opacity=".65"/>
      <circle cx="25" cy="27" r="9" fill="#56dbea"/>
      <text x="44" y="32" fill="#effaff" font-size="13" font-weight="700">EVENT</text>
      <text x="17" y="58" fill="#9cbcc6" font-size="11">user.created</text>
    </g>
    <g transform="translate(234 87)">
      <rect width="142" height="115" rx="17" fill="#0a2d35" stroke="#67f4cf" stroke-opacity=".7"/>
      <path d="M59 34V26a12 12 0 0 1 24 0v8M55 34h32v31H55z" fill="none" stroke="#89f8d8" stroke-width="4" stroke-linejoin="round"/>
      <text x="71" y="84" text-anchor="middle" fill="#effff9" font-size="13" font-weight="700">WEBHOOK</text>
      <text x="71" y="101" text-anchor="middle" fill="#9bbfb8" font-size="10">validate · process</text>
    </g>
    <g transform="translate(448 104)">
      <rect width="118" height="82" rx="15" fill="#1b2742" stroke="#9babff" stroke-opacity=".7"/>
      <path d="M15 23h35v25H15zM15 23l17.5 15L50 23" fill="none" stroke="#a8b8ff" stroke-width="2"/>
      <text x="60" y="35" fill="#f3f5ff" font-size="12" font-weight="700">EMAIL</text>
      <text x="15" y="64" fill="#b1b8d3" font-size="10">notify user</text>
    </g>
  </g>
  <text x="32" y="254" fill="#b6ccd2" font-family="Arial,sans-serif" font-size="12">Flask  /  SMTP  /  Cryptography</text>
  <rect x="1" y="1" width="598" height="288" rx="19" fill="none" stroke="#82b9e9" stroke-opacity=".28" stroke-width="2"/>
</svg>

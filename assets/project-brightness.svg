<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-labelledby="t d">
  <title id="t">Brightness Control Application v2.0.1</title>
  <desc id="d">Borderless tray app with four brightness periods and two active HDR displays.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1827"/><stop offset="1" stop-color="#153843"/></linearGradient>
    <linearGradient id="bar"><stop stop-color="#62dfec"/><stop offset="1" stop-color="#a0f7dc"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#ffe5a5"/><stop offset=".42" stop-color="#f8c880" stop-opacity=".64"/><stop offset="1" stop-color="#f8c880" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="290" rx="20" fill="url(#bg)"/>
  <circle cx="510" cy="55" r="132" fill="url(#sun)" opacity=".72"/>
  <path d="M0 226C111 184 194 262 304 221S497 179 600 235" fill="none" stroke="#79e7e7" stroke-opacity=".2" stroke-width="2"/>

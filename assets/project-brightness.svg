    <radialGradient id="sun"><stop stop-color="#ffdc88"/><stop offset=".56" stop-color="#ffbd76" stop-opacity=".7"/><stop offset="1" stop-color="#ffbd76" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="290" rx="20" fill="url(#bg)"/>
  <circle cx="504" cy="58" r="125" fill="url(#sun)" opacity=".68"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 700" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Laurino — software developer</title>
  <desc id="desc">Animated mobile introduction with a dark grid, cyan glow and software terminal.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#071119"/></linearGradient>
    <linearGradient id="a"><stop stop-color="#5ae9f7"/><stop offset=".55" stop-color="#70f4d0"/><stop offset="1" stop-color="#67a7ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#148498" stop-opacity=".42"/><stop offset="1" stop-color="#148498" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#75e7e8" stroke-opacity=".07"/></pattern>
  </defs>
  <style>
    @keyframes float {50% {transform:translateY(-8px)}}
    @keyframes blink {50% {opacity:.2}}
    .float{animation:float 6s ease-in-out infinite}.blink{animation:blink 2s steps(1,end) infinite}
    @media (prefers-reduced-motion:reduce){.float,.blink{animation:none}}
  </style>
  <rect width="660" height="700" rx="25" fill="url(#bg)"/>
  <rect width="660" height="700" rx="25" fill="url(#grid)"/>
  <circle cx="481" cy="475" r="320" fill="url(#halo)"/>
  <rect x="34" y="35" width="216" height="38" rx="19" fill="#102f3b" stroke="#5be0dd" stroke-opacity=".4"/>
  <circle cx="52" cy="54" r="5" fill="#70f4d0"/>
  <text x="70" y="60" fill="#a9f6e9" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">AVAILABLE TO BUILD</text>
  <text x="35" y="134" fill="#a4c3d0" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">SOFTWARE DEVELOPER</text>
  <text x="29" y="235" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-4">Gabriel</text>
  <text x="29" y="325" fill="url(#a)" font-family="Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-4">Laurino<tspan class="blink">_</tspan></text>
  <text x="35" y="371" fill="#d0e3e8" font-family="Arial,sans-serif" font-size="19">I build software that makes</text>
  <text x="35" y="398" fill="#d0e3e8" font-family="Arial,sans-serif" font-size="19">complex work feel simple.</text>
  <g class="float" transform="translate(34 456)">
    <rect width="592" height="183" rx="18" fill="#091a25" stroke="#5ad8de" stroke-opacity=".38"/>
    <rect width="592" height="36" rx="18" fill="#102936"/><path d="M0 20V36H592V20" fill="#102936"/>
    <circle cx="25" cy="18" r="4" fill="#ff7779"/><circle cx="41" cy="18" r="4" fill="#f3c873"/><circle cx="57" cy="18" r="4" fill="#73e0b5"/>
    <text x="23" y="71" fill="#70f4d0" font-family="Consolas,monospace" font-size="20">$</text>
    <text x="50" y="71" fill="#d5eef1" font-family="Consolas,monospace" font-size="19">focus --now</text>
    <text x="23" y="105" fill="#a9d7de" font-family="Consolas,monospace" font-size="17">01  full-stack systems</text>
    <text x="23" y="133" fill="#a9d7de" font-family="Consolas,monospace" font-size="17">02  automation &amp; tooling</text>
    <text x="23" y="161" fill="#a9d7de" font-family="Consolas,monospace" font-size="17">03  enterprise integrations</text>
  </g>
  <text x="35" y="673" fill="#86aeba" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">BUILD  /  AUTOMATE  /  CONNECT</text>
  <rect x="1" y="1" width="658" height="698" rx="24" fill="none" stroke="url(#a)" stroke-opacity=".42" stroke-width="2"/>
</svg>

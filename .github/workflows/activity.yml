name: Refresh profile activity

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render activity from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/render-activity.mjs

      - name: Commit refreshed artwork
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add assets/activity.svg
          if git diff --cached --quiet; then
            echo "Activity artwork is unchanged"
            exit 0
          fi
          git commit -m "Refresh profile activity artwork"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
